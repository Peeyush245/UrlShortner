spring.application.name=urlshortner

# Override at startup with SERVER_PORT=9090 or --server.port=9090
server.port=8082

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expired-link cleanup schedule (sec min hour day month weekday): top of every hour
urlshortener.cleanup.cron=0 0 * * * *
